<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛠️ Admin Panel</h1>

    <!-- Login Section -->
    <div id="login-section" class="admin-section">
        <h2>Admin Login</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required />
            <input type="password" id="password" placeholder="Password" required />
            <button type="submit" class="btn-primary">Login</button>
        </form>
        <p id="login-error" class="error-text"></p>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="admin-section hidden">
        <div class="flex-header">
            <h2>Manage Posts</h2>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>

        <!-- Create Post Form -->
        <div class="section-divider">
            <h3>Create New Post</h3>
            <form id="create-post-form" class="admin-form">
                <input type="text" id="post-title" placeholder="Post Title" required />
                <textarea id="post-content" placeholder="Post Content" rows="4" required></textarea>
                <label>
                    <input type="checkbox" id="post-published" checked /> Published
                </label>
                <br><br>
                <button type="submit" class="btn-success">Publish Post</button>
            </form>
        </div>

        <!-- Posts List with Actions -->
        <div class="section-divider">
            <h3>Existing Posts</h3>
            <div id="admin-posts-container">Loading posts...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://blog-api-backend-71br.onrender.com/api';
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const createPostForm = document.getElementById('create-post-form');
        const adminPostsContainer = document.getElementById('admin-posts-container');

        const token = localStorage.getItem('token');
        if (token) {
            showDashboard();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    showDashboard();
                } else {
                    loginError.textContent = data.error || 'Invalid credentials';
                }
            } catch (err) {
                console.error('Login error:', err);
                loginError.textContent = 'Server error during login.';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('token');
            dashboardSection.classList.add('hidden');
            loginSection.classList.remove('hidden');
        });

        function showDashboard() {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            fetchAdminPosts();
        }

        async function fetchAdminPosts() {
            try {
                const response = await fetch(`${API_BASE}/posts`);
                const posts = await response.json();

                if (posts.length === 0) {
                    adminPostsContainer.innerHTML = '<p>No posts found.</p>';
                    return;
                }

                adminPostsContainer.innerHTML = '';
                posts.forEach(post => {
                    const postEl = document.createElement('div');
                    postEl.className = 'post';

                    const toggleText = post.published ? 'Unpublish' : 'Publish';

                    postEl.innerHTML = `
                        <h4>${post.title} (${post.published ? 'Published' : 'Draft'})</h4>
                        <p>${post.content.substring(0, 100)}...</p>
                        <div class="section-divider" style="margin-top: 10px; border-top: none; padding-top: 0;">
                            <button class="toggle-btn" data-id="${post.id}" data-published="${post.published}">${toggleText}</button>
                            <button class="delete-btn" data-id="${post.id}">Delete Post</button>
                        </div>
                    `;
                    adminPostsContainer.appendChild(postEl);
                });

                attachActionListeners();
            } catch (err) {
                console.error('Error fetching admin posts:', err);
                adminPostsContainer.innerHTML = '<p style="color: red;">Error loading posts.</p>';
            }
        }

        createPostForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const published = document.getElementById('post-published').checked;
            const currentToken = localStorage.getItem('token');

            try {
                const response = await fetch(`${API_BASE}/posts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${currentToken}`
                    },
                    body: JSON.stringify({ title, content, published })
                });

                if (response.ok) {
                    document.getElementById('post-title').value = '';
                    document.getElementById('post-content').value = '';
                    fetchAdminPosts();
                } else {
                    alert('Failed to create post.');
                }
            } catch (err) {
                console.error('Error creating post:', err);
                alert('Server error while creating post.');
            }
        });

        function attachActionListeners() {
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', async () => {
                    const postId = button.getAttribute('data-id');
                    if (!confirm('Are you sure you want to delete this post?')) return;

                    const currentToken = localStorage.getItem('token');
                    try {
                        const response = await fetch(`${API_BASE}/posts/${postId}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${currentToken}` }
                        });

                        if (response.ok) {
                            fetchAdminPosts();
                        } else {
                            alert('Failed to delete post.');
                        }
                    } catch (err) {
                        console.error('Error deleting post:', err);
                    }
                });
            });

            document.querySelectorAll('.toggle-btn').forEach(button => {
                button.addEventListener('click', async () => {
                    const postId = button.getAttribute('data-id');
                    const currentPublished = button.getAttribute('data-published') === 'true';
                    const newPublishedState = !currentPublished;

                    const currentToken = localStorage.getItem('token');
                    try {
                        const response = await fetch(`${API_BASE}/posts/${postId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${currentToken}`
                            },
                            body: JSON.stringify({ published: newPublishedState })
                        });

                        if (response.ok) {
                            fetchAdminPosts();
                        } else {
                            alert('Failed to update post status.');
                        }
                    } catch (err) {
                        console.error('Error updating post status:', err);
                    }
                });
            });
        }
    </script>
</body>
</html>
